spring.application.name=eazystore


logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

spring.h2.console.enabled=true

#spring.datasource.url=jdbc:h2:file:~/eazystore;AUTO_SERVER=true
#spring.datasource.url=jdbc:h2:mem:testDb
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:eazystore}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.sql.init.mode=embedded
# To print SQL on the console
spring.jpa.show-sql=${JPA_SHOW_URL:true}
# To print properly to format SQL on the console
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

# Never use below properties in your production application, only for learning purpose we can use it..
#spring.sql.init.schema-locations=optional:classpath:sql/schema.sql
#spring.sql.init.data-locations=optional:classpath:sql/data.sql